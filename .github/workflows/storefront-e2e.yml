name: Storefront E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: liquorcentral
          POSTGRES_PASSWORD: liquorcentral_ci_password
          POSTGRES_DB: liquorcentral_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://liquorcentral:liquorcentral_ci_password@localhost:5432/liquorcentral_e2e
      REDIS_URL: redis://localhost:6379
      EVENTS_REDIS_URL: redis://localhost:6379
      WE_REDIS_URL: redis://localhost:6379
      LOCKING_REDIS_URL: redis://localhost:6379
      CACHE_REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e-ci-secret
      COOKIE_SECRET: e2e-ci-secret
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:9000,http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: backend
        run: yarn install --frozen-lockfile

      - name: Install storefront dependencies
        working-directory: storefront
        run: yarn install --frozen-lockfile

      # Runs every file under src/migration-scripts against the fresh
      # database — schema migrations, the store/region/tax foundation,
      # the full product catalog, categories, and the flat shipping
      # option, all in one step. Verified locally against a throwaway
      # database before wiring this in: nothing here is guessed.
      - name: Migrate & seed backend
        working-directory: backend/apps/backend
        run: npx medusa db:migrate

      # The storefront needs this to call the Store API at all, and it's
      # generated fresh by the seed above — a new random ID every run,
      # not something that can be hardcoded.
      - name: Read the seeded publishable API key
        id: pubkey
        run: |
          KEY=$(PGPASSWORD=liquorcentral_ci_password psql -h localhost -U liquorcentral -d liquorcentral_e2e -t -A \
            -c "SELECT token FROM api_key WHERE type='publishable' LIMIT 1;")
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Start Medusa backend
        working-directory: backend/apps/backend
        run: |
          yarn build
          nohup yarn start > /tmp/medusa.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/health && exit 0
            sleep 2
          done
          echo "Backend did not become healthy in time" && cat /tmp/medusa.log && exit 1

      # No separate "start the storefront" step: playwright.config.ts's
      # own `webServer` runs `yarn build && yarn start` itself and waits
      # for it to answer before the suite starts (reuseExistingServer is
      # false whenever CI is set) — starting it again here would just
      # race the same `yarn start` against itself for port 8000.
      - name: Run Playwright
        working-directory: storefront
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ steps.pubkey.outputs.key }}
          NEXT_PUBLIC_DEFAULT_REGION: ng
          NEXT_PUBLIC_BASE_URL: http://localhost:8000
          CI: "true"
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Backend log on failure
        if: failure()
        run: cat /tmp/medusa.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: storefront/playwright-report/
          retention-days: 14
